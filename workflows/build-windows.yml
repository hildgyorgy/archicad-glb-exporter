name: Build Windows Add-On

on:
  workflow_dispatch:
    inputs:
      devkit_tag:
        description: "GRAPHISOFT/archicad-api-devkit release tag to build against"
        required: false
        default: "29.3100"
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      ADDON_NAME: DropViewGLBExporter
      DEVKIT_TAG: ${{ github.event.inputs.devkit_tag || '29.3100' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The exact asset filename in the DevKit release isn't hard-coded here on
      # purpose - it's looked up via the GitHub Releases API so this doesn't
      # break silently if Graphisoft renames it between builds.
      - name: Download Archicad API DevKit (Windows)
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/GRAPHISOFT/archicad-api-devkit/releases/tags/$env:DEVKIT_TAG"
          $asset = $release.assets | Where-Object { $_.name -match '(?i)win' -and $_.name -match '(?i)\.zip$' } | Select-Object -First 1
          if (-not $asset) {
            Write-Error "No Windows DevKit asset found for tag $env:DEVKIT_TAG. Check https://github.com/GRAPHISOFT/archicad-api-devkit/releases"
            exit 1
          }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile devkit.zip
          Expand-Archive -Path devkit.zip -DestinationPath devkit -Force
          # The DevKit zip usually contains a single top-level folder; surface its path.
          $devkitRoot = Get-ChildItem -Path devkit -Directory | Select-Object -First 1
          echo "AC_API_DEVKIT_DIR=$($devkitRoot.FullName)" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DAC_API_DEVKIT_DIR="$env:AC_API_DEVKIT_DIR" `
            -DAC_ADDON_NAME="$env:ADDON_NAME" `
            -DAC_ADDON_LANGUAGE="INT"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release

      - name: Locate build output
        shell: pwsh
        run: |
          $apx = Get-ChildItem -Path build -Recurse -Filter "$env:ADDON_NAME.apx" | Select-Object -First 1
          if (-not $apx) {
            Write-Error "Build succeeded but no .apx was found under build/. Check the build log above."
            exit 1
          }
          Write-Host "Found: $($apx.FullName)"
          echo "APX_PATH=$($apx.FullName)" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ADDON_NAME }}-AC29-Windows-x64
          path: ${{ env.APX_PATH }}
          if-no-files-found: error
