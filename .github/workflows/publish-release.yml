name: Publish Full Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (leave empty to use VERSION)
        required: false
        type: string
      prerelease:
        description: Mark the GitHub release as a pre-release
        required: true
        default: false
        type: boolean
      replace_existing:
        description: Replace an existing release and move its tag to this build (use only for a deliberate same-version rebuild)
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-dropview-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          if [[ -z "$version" ]]; then
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows packages
    needs: validate
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  macos:
    name: macOS packages
    needs: validate
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.validate.outputs.version }}
    secrets: inherit

  publish:
    name: Publish GitHub release
    needs: [validate, windows, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.validate.outputs.version }}
      REPLACE_EXISTING: ${{ inputs.replace_existing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: DropView-GLB-Exporter-AC28-30-Windows-x64-v${{ env.VERSION }}
          path: release-assets

      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: DropView-GLB-Exporter-AC28-30-macOS26-arm64-v${{ env.VERSION }}
          path: release-assets

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          mapfile -d '' assets < <(find release-assets -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.sha256' \) -print0 | sort -z)
          if [[ "${#assets[@]}" -ne 4 ]]; then
            echo "Expected four release files, found ${#assets[@]}." >&2
            find release-assets -type f -print
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$REPLACE_EXISTING" != 'true' || "$GITHUB_REF" != 'refs/heads/main' ]]; then
              echo "Release $tag already exists; explicit replacement from main is required." >&2
              exit 1
            fi
            existing_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
            if [[ -z "$existing_tag_sha" ]]; then
              echo "Cannot resolve existing tag $tag." >&2
              exit 1
            fi
            mkdir -p previous-release
            gh release download "$tag" --dir previous-release
            gh release view "$tag" --json body --jq '.body' > previous-release/RELEASE_NOTES.md
            printf '%s\n' "$existing_tag_sha" > previous-release/tag-commit.txt
            echo "Backed up $tag from $existing_tag_sha before replacement."
          fi
      - name: Save previous release assets
        if: ${{ inputs.replace_existing }}
        uses: actions/upload-artifact@v7
        with:
          name: previous-v${{ env.VERSION }}-release
          path: previous-release
          if-no-files-found: ignore

      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          mapfile -d '' assets < <(find release-assets -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.sha256' \) -print0 | sort -z)
          if [[ "${#assets[@]}" -ne 4 ]]; then
            echo "Expected four release files, found ${#assets[@]}." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$REPLACE_EXISTING" != 'true' || "$GITHUB_REF" != 'refs/heads/main' ]]; then
              echo "Release $tag already exists; explicit replacement from main is required." >&2
              exit 1
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$tag" --target "$GITHUB_SHA" --notes-file RELEASE_NOTES.md
            echo "Updated release $tag and moved its tag to $GITHUB_SHA."
            exit 0
          fi
          arguments=(release create "$tag" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Drop & View GLB Exporter $tag" \
            --notes-file RELEASE_NOTES.md)
          if [[ '${{ inputs.prerelease }}' == 'true' ]]; then
            arguments+=(--prerelease)
          fi
          gh "${arguments[@]}"
