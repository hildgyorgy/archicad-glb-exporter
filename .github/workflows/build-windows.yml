name: Build Windows Add-On

on:
  workflow_call:
    inputs:
      version:
        description: Package version without the leading v
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the leading v
        required: true
        default: 0.3.0-alpha
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Archicad ${{ matrix.archicad }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - archicad: 28
            devkit_tag: "28.4001"
            toolset: v142
          - archicad: 29
            devkit_tag: "29.3100"
            toolset: v143
    env:
      ADDON_NAME: DropViewGLBExporter
      DEVKIT_TAG: ${{ matrix.devkit_tag }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Download Archicad API DevKit (Windows)
        shell: pwsh
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/repos/GRAPHISOFT/archicad-api-devkit/releases/tags/$env:DEVKIT_TAG"
          $assets = @($release.assets | Where-Object {
            $_.name -match '(?i)^API\.Development\.Kit\.WIN\..*\.zip$'
          })
          if ($assets.Count -ne 1) {
            Write-Error "Expected exactly one Windows API DevKit ZIP for tag $env:DEVKIT_TAG, found $($assets.Count)."
            exit 1
          }
          $asset = $assets[0]
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile devkit.zip

          if ($asset.digest -match '^sha256:(?<hash>[0-9a-fA-F]{64})$') {
            $expectedHash = $Matches.hash.ToLowerInvariant()
            $actualHash = (Get-FileHash -Path devkit.zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              Write-Error "DevKit checksum mismatch. Expected $expectedHash, got $actualHash."
              exit 1
            }
            Write-Host "DevKit SHA-256 verified: $actualHash"
          } else {
            Write-Warning "The release API did not provide a SHA-256 digest for $($asset.name)."
          }

          Expand-Archive -Path devkit.zip -DestinationPath devkit -Force

          $marker = Get-ChildItem -Path devkit -Recurse -File -Filter ACAPinc.h |
            Where-Object { $_.FullName -match '[\\/]Support[\\/]Inc[\\/]ACAPinc\.h$' } |
            Select-Object -First 1
          if (-not $marker) {
            Write-Error "Could not locate Support/Inc/ACAPinc.h in the extracted DevKit."
            exit 1
          }
          $incDir = Split-Path $marker.FullName -Parent
          $supportDir = Split-Path $incDir -Parent
          $devkitRoot = Split-Path $supportDir -Parent
          Write-Host "DevKit root: $devkitRoot"
          echo "AC_API_DEVKIT_DIR=$devkitRoot" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version) {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T ${{ matrix.toolset }} `
            -DAC_API_DEVKIT_DIR="$env:AC_API_DEVKIT_DIR" `
            -DAC_ADDON_NAME="$env:ADDON_NAME" `
            -DAC_ADDON_LANGUAGE="INT" `
            -DDROPVIEW_VERSION="$version"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release

      - name: Locate build output
        shell: pwsh
        run: |
          $apx = Get-ChildItem -Path build -Recurse -Filter "$env:ADDON_NAME.apx" | Select-Object -First 1
          if (-not $apx) {
            Write-Error "Build succeeded but no .apx was found under build/. Check the build log above."
            exit 1
          }
          Write-Host "Found: $($apx.FullName)"
          echo "APX_PATH=$($apx.FullName)" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ADDON_NAME }}-AC${{ matrix.archicad }}-Windows-x64
          path: ${{ env.APX_PATH }}
          if-no-files-found: error

  package-windows:
    name: Package Archicad 28-29
    needs: build-windows
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Archicad 28 artifact
        uses: actions/download-artifact@v8
        with:
          name: DropViewGLBExporter-AC28-Windows-x64
          path: downloaded/Archicad 28

      - name: Download Archicad 29 artifact
        uses: actions/download-artifact@v8
        with:
          name: DropViewGLBExporter-AC29-Windows-x64
          path: downloaded/Archicad 29

      - name: Create release ZIP
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } elseif ("${{ inputs.version }}") {
            "${{ inputs.version }}"
          } else {
            "0.3.0-alpha"
          }
          $archiveName = "DropView-GLB-Exporter-AC28-29-Windows-x64-v$version"
          $stage = Join-Path $env:RUNNER_TEMP $archiveName
          New-Item -ItemType Directory -Path "$stage/Archicad 28", "$stage/Archicad 29" -Force | Out-Null
          Copy-Item "downloaded/Archicad 28/DropViewGLBExporter.apx" "$stage/Archicad 28/"
          Copy-Item "downloaded/Archicad 29/DropViewGLBExporter.apx" "$stage/Archicad 29/"
          Copy-Item README.md "$stage/README.md"
          Copy-Item LICENSE "$stage/LICENSE.txt"
          Copy-Item THIRD_PARTY_NOTICES.txt "$stage/THIRD_PARTY_NOTICES.txt"
          Compress-Archive -Path $stage -DestinationPath "$archiveName.zip"
          $hash = Get-FileHash "$archiveName.zip" -Algorithm SHA256
          $checksum = "$($hash.Hash.ToLowerInvariant())  $archiveName.zip`n"
          [IO.File]::WriteAllText("$archiveName.zip.sha256", $checksum, [Text.UTF8Encoding]::new($false))
          "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}.zip
            ${{ env.ARCHIVE_NAME }}.zip.sha256
          if-no-files-found: error
